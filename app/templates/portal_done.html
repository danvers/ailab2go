<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ event_name }} · Verbunden</title>
<!--
  Step 2 of the captive flow (after the big button): the device is signed
  in — its connectivity probes succeed from here on. This page's only job
  is walking the visitor OUT of the captive sheet. Hard-won knowledge:
  there is NO working programmatic escape (x-safari:// errors on current
  iOS — tested on real hardware), so each platform gets its own SUPPORTED
  exit, spelled out in big steps:
    iOS     — "Fertig" now keeps the Wi-Fi, because the sign-in makes the
              next connectivity probe succeed. Then Safari + address.
    Android — the sheet's ⋮ menu has a built-in "open in browser"; the
              one-time "stay connected?" dialog must be confirmed.
  Bonus safety net (wildcard DNS + redirect): ANY web address typed in the
  real browser lands on the exhibit — the page says so, because it makes
  the address impossible to get wrong. No JavaScript: captive webviews are
  the most restricted browsers we serve.
-->
<style>
  /* One visual system, shared with the portal page: brand gradient
     (#400b67 -> #c32683) for identity, ONE green element (the check) for
     success. Compact on purpose — captive sheets are small windows that
     often cannot scroll, so the whole card must fit ~560px of height. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #e8ecf5; color: #141a33;
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 12px;
  }
  .card {
    background: #fdfdfd; border-radius: 20px;
    box-shadow: 0 14px 44px rgba(20, 26, 51, 0.16);
    padding: 22px 22px 16px; max-width: 400px; width: 100%;
    text-align: center; overflow: hidden; position: relative;
  }
  .card::before { content: ""; position: absolute; left: 0; right: 0; top: 0;
    height: 5px; background: linear-gradient(90deg, #400b67, #c32683); }
  .top { display: flex; align-items: center; justify-content: center;
         gap: 12px; margin-bottom: 4px; }
  .check {
    flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, #0e6b47, #1fa877);
    color: #fff; font-size: 1.5rem; line-height: 44px;
  }
  h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.01em;
       color: #400b67; }
  @supports (-webkit-background-clip: text) {
    h1 {
      background: linear-gradient(90deg, #400b67, #c32683);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  }
  .sub { color: #5a6382; font-size: 0.9rem; line-height: 1.45;
         margin-bottom: 14px; }
  .sub .en { color: #8a91a8; font-size: 0.8rem; }
  .steps {
    text-align: left; margin-bottom: 12px;
    counter-reset: step;
    display: flex; flex-direction: column; gap: 6px;
  }
  .step {
    display: flex; align-items: center; gap: 11px;
    background: #f2f5fb; border-radius: 12px; padding: 10px 12px;
    font-size: 0.95rem; line-height: 1.4; color: #1c2440;
  }
  .step small { color: #5a6382; }
  .step::before {
    counter-increment: step; content: counter(step);
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, #400b67, #c32683);
    color: #fff; font-weight: 800; font-size: 0.85rem;
    display: flex; align-items: center; justify-content: center;
  }
  .step strong { font-weight: 800; }
  .addr {
    display: block; font-family: ui-monospace, Menlo, monospace;
    font-size: 1.4rem; font-weight: 700; letter-spacing: 0.03em;
    background: linear-gradient(120deg, #2a1245, #400b67);
    color: #fff;
    border-radius: 12px; padding: 11px 10px 9px; margin-bottom: 10px;
    text-decoration: none;
  }
  .addr small {
    display: block; margin-top: 3px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0;
    color: rgba(255, 255, 255, 0.75);
  }
  .addr:active { transform: scale(0.985); }
  .fine { color: #6b7390; font-size: 0.76rem; line-height: 1.5; }
</style>
</head>
<body>
  <main class="card">
    <div class="top">
      <div class="check" aria-hidden="true">✓</div>
      <h1>{{ t.connected }}</h1>
    </div>
    <p class="sub">{{ t.sub }}</p>

    {% set key = platform if platform in ("ios", "android") else "other" %}
    <div class="steps">
      <div class="step"><span>{{ t["s1_" + key]|safe }}<br>
        <small>{{ t["s1s_" + key]|safe }}</small></span></div>
      <div class="step"><span>{{ t["s2_" + key]|safe }}</span></div>
    </div>

    <a class="addr" href="{{ url }}">{{ url_short }}
      <small>{{ t.tap }}</small></a>

    <p class="fine">{{ t.fine_done|safe }}</p>
  </main>
</body>
</html>
