<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ event_name }} · Willkommen</title>
<!--
  Captive-portal landing page ("sign-in sheet" content). Design follows the
  printed poster: light, glitch-gradient wordmark, both logos, ONE big
  button. Loading THIS page does not sign the device in — only following
  the button to "/" does (see webserver.captive_redirect) — so the sheet
  stays open until the visitor actively taps, instead of auto-validating
  and being dismissed by the OS mid-read. No JavaScript on purpose:
  captive webviews are the most restricted browsers we ever serve.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #e8ecf5;
    color: #141a33;
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 18px;
  }
  /* Same card grammar as the "Verbunden" page: 400px, 20px radius,
     one 5px brand strip. (The playful glitch bars from the card deck
     looked like a rendering bug inside a captive sheet — removed.) */
  .card {
    background: #fdfdfd;
    border-radius: 20px;
    box-shadow: 0 14px 44px rgba(20, 26, 51, 0.16);
    padding: 24px 22px 18px;
    max-width: 400px; width: 100%;
    text-align: center;
    overflow: hidden;
    position: relative;
  }
  .card::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0;
    height: 5px; background: linear-gradient(90deg, #400b67, #c32683);
  }
  .logos {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin-bottom: 18px;
  }
  .logos img { height: 30px; width: auto; }
  h1 {
    font-size: 2.1rem; font-weight: 800; letter-spacing: -0.01em;
    color: #400b67;
    margin-bottom: 16px;
  }
  /* gradient wordmark only where the clip trick is supported — elsewhere
     the plain dark violet above keeps the title readable */
  @supports (-webkit-background-clip: text) {
    h1 {
      background: linear-gradient(90deg, #400b67, #c32683);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  }
  .sub { color: #5a6382; font-size: 0.92rem; line-height: 1.45;
         margin-bottom: 18px; }
  .sub .en { color: #8a91a8; font-size: 0.8rem; }
  .go {
    display: block;
    background: linear-gradient(90deg, #400b67, #c32683);
    color: #fff; text-decoration: none;
    font-size: 1.3rem; font-weight: 800;
    padding: 20px 18px;
    border-radius: 16px;
    box-shadow: 0 10px 26px rgba(195, 38, 131, 0.35);
    margin-bottom: 8px;
  }
  .go:active { transform: scale(0.98); }
  .go small { display: block; font-size: 0.78rem; font-weight: 600; opacity: 0.85; margin-top: 3px; }
  .fine {
    margin-top: 18px; color: #6b7390; font-size: 0.78rem; line-height: 1.55;
  }
  .fine code {
    font-family: ui-monospace, Menlo, monospace;
    background: #eef1f8; border: 1px solid #c9d0e2; border-radius: 5px;
    padding: 1px 6px; color: #141a33;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logos">
      <img src="/static/logo.png" alt="SKILL">
      <img src="/static/logo2.png" alt="aiwareness Lab">
    </div>
    <h1>{{ event_name }}</h1>

    <a class="go" href="/portal/go">{{ t.go|safe }}
      <small>{{ t.go_small }}</small></a>

    <p class="fine">{{ t.fine_portal|safe }} <code>{{ url_short }}</code></p>
  </main>
</body>
</html>
